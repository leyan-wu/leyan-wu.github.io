- slug: juxta
  name: "Disrupted Harmony: How Visual–Audio Incongruence Influences Creativity in Collage Making"
  theme: "Co-Creative Systems"
  flagship: true
  role: HII Lab | Duke Kunshan University
  period: Jan – July 2026
  brief: >
    A physical collage system that uses intentional visual–audio incongruence as productive friction,
    grounded in Koestler's bisociation, to probe creativity support and authorial agency.
  motivation: >
    Can deliberately designed mismatch—not seamless multimodal alignment—act as productive friction
    during collage making? RQ1: effects on creativity support and cognitive load; RQ2: creative and
    emotional experience.
  contribution: >
    I led system design, YOLOv8 fine-tuning, and pre-study calibration (SBERT sweet spot 0.72–0.92);
    with lab collaborators, ran the main study (N=16) and analysis. First author, ICMI 2026.
  insight: >
    Incongruent feedback raised surprisingness without increasing cognitive load or lowering expert
    ratings; qualitative themes show de-habituation, reframing, and active authorial negotiation.
  reflection: >
    P8's incongruent-triggered dreamscape reframing and P9's shredding of congruent materials
    illustrate that participants evaluated and resisted system cues—not passive consumption.
  highlights:
    - On-device YOLOv8 tracking of six collage elements with congruent/incongruent audio feedback
    - Pre-study (N=5) calibrating sound–image semantic distance via SBERT and participant ratings
    - Within-subjects main study (N=16) with CSI, NASA-TLX, Surprisingness Scale, and interviews
  tags: [Multimodal AI, Co-Creativity, Productive Friction, Bisociation, YOLOv8, SBERT]
  paper: First-author paper, accepted by ICMI 2026
  image: /assets/research/juxta/figure-1.png

- slug: chi-digital-collage
  name: "Exploring the Impacts of AI Technologies on Digital Collage Creation"
  theme: "Co-Creative Systems"
  flagship: false
  role: CHI EA 2025
  period: Jan – May 2025
  brief: >
    A co-design study on how AI techniques reshape digital collage-making—creative ownership, emotional
    engagement, and when AI support stays welcome vs. oversteps.
  motivation: >
    How does AI reshape collage-making beyond speed—changing users' sense of creative ownership and
    emotional engagement across selecting, editing, composing, and finalizing?
  contribution: >
    Co-designed workshop protocol and AI tool selection; facilitated one of two participant groups;
    co-built codebook via independent open-coding (30%); contributed to manuscript. Second author, CHI EA 2025.
  insight: >
    AI was welcomed as collaborator when optional and authorship stayed with the maker—participants
    pushed back when composition or text generation threatened personal meaning in arrangements.
  reflection: >
    First empirical HCI study; the tension between AI assistance and human agency connects forward
    to Coller and the ICMI bisociation work.
  highlights:
    - Co-design workshop (N=8) with FreeMix and AI tools mapped to four collage stages
    - Independent open-coding (30%) for shared codebook; thematic analysis with ATLAS.ti
    - Published at CHI EA 2025
  tags: [Co-Design, Digital Collage, Generative AI, Thematic Analysis, ATLAS.ti]
  paper: Second-author paper, CHI EA 2025
  image: /assets/research/chi-digital-collage/figure-1-teaser.png

- slug: coller
  name: "Coller: An AI-Assisted Traditional Collage-Making System for Therapeutic-Oriented Support"
  theme: "AI & Well-being"
  flagship: false
  role: Student Research Scholar (SRS) Program | Research Assistant | HII Lab | Duke Kunshan University
  period: May - Dec 2025
  brief: >
    An AI-assisted system for self-guided physical collage-making that preserves tactile, embodied
    making while offering therapeutic-oriented scaffolding across before, during, and after creation.
  motivation: >
    Can AI support self-guided traditional physical collage-making—preserving cutting, pasting, and
    material handling—without replacing therapist facilitation or the medium's embodied qualities?
  contribution: >
    Co-designed Coller with creators and mental-health professionals; led interview analysis using
    the Expressive Therapies Continuum (ETC). Second author, ACM DIS 2026 Workshop on AI for Therapy.
  insight: >
    Coller was most salient at the Cognitive/Symbolic level; participants read the system's role as
    stage-sensitive—guide before, companion during, dialogic partner after creation.
  reflection: >
    AI in emotionally sensitive creative contexts works best as scaffolding sensitive to activity
    stage—not as replacement for material engagement or professional facilitation.
  highlights:
    - Three-stage support: meditation/thematic guidance, sound triggers + voice assistant, reflection + soundscape story
    - Exploratory study with 12 participants and 3 mental-health professionals
    - ETC-based analysis across Kinesthetic/Sensory through Creative dimensions
  tags: [Therapeutic Design, Expressive Therapies Continuum, Human-AI Collaboration, Reflective Dialogue, Generative AI]
  paper: Second-author paper, ACM DIS 2026 Workshop on AI for Therapy
  image: /assets/research/coller/system-overview.png

- slug: semantic-boundaries
  name: "The Semantic Boundaries of Creativity"
  theme: "Computational Creativity"
  flagship: false
  role: Independent Research Project
  period: Oct 2026
  brief: >
    An exploratory NLP study connecting semantic distinctiveness with expert judgments across 479
    human and AI stories, while stress-testing the measurement across encoders and reference pools.
  motivation: >
    When does semantic unusualness correspond to perceived originality—and when does the measurement
    reflect the assumptions of its encoder, aggregation rule, or comparison set?
  contribution: >
    Developed an auditable, AI-assisted Python workflow for verified text–rating joins, lossless
    Sentence Transformer encoding, cosine-distance metrics, clustered models, and paired robustness checks.
  insight: >
    Distinctiveness has a modest, encoder-robust association with originality, but limited explanatory
    power; outcome specificity and human–AI comparisons remain sensitive to measurement choices.
  reflection: >
    Computational creativity measures become more useful when their boundaries are treated as findings:
    the reference pool and representation model are part of the construct, not neutral implementation details.
  highlights:
    - 479 stories, 958 valid expert evaluations, and 120 participant/model groups
    - MiniLM/MPNet encoders with tokenizer-aware, lossless text aggregation
    - Clustered OLS, paired group bootstrap, and reference-pool sensitivity analysis
  tags: [Computational Creativity, NLP, Sentence Transformers, Measurement Validity, Reproducible Research]
  image: /assets/research/semantic-boundaries/originality-encoder-coefficients.png
  links:
    - label: View research repository
      url: https://github.com/leyan-wu/semantic-boundaries-of-creativity

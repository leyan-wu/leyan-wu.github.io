framing: >
  My creative practice is one way I develop and investigate research questions. Working with interactive
  artificial life, film, poetry, photography, and zine-making keeps me close to embodiment, fragmentation,
  memory, and materiality—the same concerns that shape my HCI work on co-creativity and emotional reflection.

interactive:
  - slug: lumen
    name: "Lumen: A Digital Lifeform"
    rotation: -1.1
    theme: "Interactive Practice"
    role: Independent Interactive Work
    period: Sep – Oct 2026
    brief: >
      A hand-tracked, voice-enabled artificial organism that explores how an embodied AI presence can
      invite curiosity, care, and moments of comfort in an increasingly digital world.
    insight: >
      Embodiment gives an AI encounter a new grammar: distance creates anticipation, touch requires pacing,
      and a persistent body makes the history of a relationship perceptible without claiming consciousness.
    highlights:
      - Local hand tracking with proximity, gentle touch, and startle responses
      - Streaming voice conversation with persistent browser-local memory
      - Seeded growth, autonomous activities, sleep cycles, and a dream journal
    tags: [Embodied AI, Artificial Life, Hand Tracking, Voice Interaction, Affective Computing]
    image: /assets/research/lumen/lumen-organism.svg
    url: /practice/lumen/
    links:
      - label: Experience Lumen
        url: https://lumen-lifeform.leyanwu56.chatgpt.site
      - label: View source on GitHub
        url: https://github.com/leyan-wu/lumen

films:
  - slug: another-ending-of-june
    title: "Another Ending of June"
    rotation: -1.2
    role: "Short Film · Writer–Director · Cinematography"
    place: "Durham, NC"
    period: "Sep – Dec 2025"
    slate:
      roll: "ROLL 01"
      credits: "WRITER/DIR · DURHAM, NC"
      dates: "SEP–DEC 2025"
    status: "Currently in post-production. The stills above are from set; I'll add the film itself once it's cut."
    synopsis: >
      Two young women, one summer that won't quite end. Another Ending of June follows them through
      emotional numbness and quiet existential drift—naturalistic vignettes building toward a dream
      sequence centered on a house, silently burning. Not destruction so much as a wish: to finally
      witness catharsis, to watch something transform instead of just persisting.
    process: >
      I wrote and directed the film, operated a RED Digital Cinema camera through principal photography,
      and built its visual language around a handful of recurring motifs—a ticking clock, the ocean,
      an old tree, candlelight against dark—each one doing quiet work to externalize what the characters
      can't quite say out loud.
    url: /practice/another-ending-of-june/
